name: Tutbury native original JPEG and Common Crawl verification
on:
  push:
    paths:
      - '.github/workflows/tutbury-native-and-commoncrawl.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/tutbury_native_commoncrawl.py
      - name: Save native JPEG and independent archive findings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A recovered/tutbury-castle page-audit/tutbury-native-and-commoncrawl.json
          if git diff --cached --quiet; then echo No changes; else git commit -m 'Preserve native JPEGs and audit Tutbury gallery in Common Crawl' && git pull --rebase origin main && git push origin HEAD:main; fi
