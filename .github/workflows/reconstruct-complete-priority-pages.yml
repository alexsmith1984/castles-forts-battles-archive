name: Reconstruct complete priority pages locally

on:
  push:
    paths:
      - '.github/workflows/reconstruct-complete-priority-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Rebuild five priority pages with local archived images
        run: |
          cat > /tmp/rebuild.py <<'PY'
          import json,os,re,time,hashlib,html
          from urllib.parse import urljoin,urlsplit
          from collections import Counter
          import requests
          from bs4 import BeautifulSoup

          TARGETS={
            'Clun Castle':'clun-castle',
            'Moreton Corbet Castle':'moreton-corbet-castle',
            'Stafford Castle':'stafford-castle',
            'Stokesay Castle':'stokesay-castle',
            'Tutbury Castle':'tutbury-castle',
          }
          inv=json.load(open('catalogue-audit/source-inventory.json',encoding='utf-8'))['results']
          byname={r['primary_name']:r for r in inv}
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 (CastlesFortsBattles reconstruction)'
          image_ext=re.compile(r'\.(?:jpe?g|png|gif|webp|bmp|tiff?)(?:[?#].*)?$',re.I)
          css_url_re=re.compile(r'url\(([^)]+)\)',re.I)

          def fetch(url,timeout=45):
            last=None
            for delay in (0,3,8):
              if delay: time.sleep(delay)
              try:
                r=s.get(url,timeout=timeout,allow_redirects=True)
                if r.status_code==200:return r
                last=r
                if r.status_code not in (429,500,502,503,504):return r
              except Exception as ex:last=ex
            return last

          def safe_name(url):
            b=os.path.basename(urlsplit(url).path) or 'image'
            b=re.sub(r'[^A-Za-z0-9._-]+','_',b)
            stem,ext=os.path.splitext(b)
            h=hashlib.sha1(url.encode()).hexdigest()[:8]
            return f'{stem}-{h}{ext or ".bin"}'

          def wayback_raw(ts,orig):
            return f'https://web.archive.org/web/{ts}id_/{orig}'

          def inline_styles(soup,ts,base):
            added=[]
            for link in list(soup.find_all('link',href=True)):
              rel=' '.join(link.get('rel') or []).lower()
              if 'stylesheet' not in rel:continue
              href=urljoin(base,link['href'])
              r=fetch(wayback_raw(ts,href),30)
              if hasattr(r,'status_code') and r.status_code==200:
                try:txt=r.text
                except:txt=''
                if txt:
                  txt=css_url_re.sub('none',txt)
                  st=soup.new_tag('style');st.string=txt;link.replace_with(st);added.append(href);continue
              link.decompose()
            # fallback guarantees readability even if historical CSS does not survive
            st=soup.new_tag('style')
            st.string='''body{font-family:Georgia,"Times New Roman",serif!important;line-height:1.45!important;background:#fff!important;color:#222!important;max-width:1200px;margin:0 auto;padding:18px}img{max-width:100%!important;height:auto!important}.archive-recovery-banner{background:#f4f0e6;border:1px solid #cfc3af;padding:12px 14px;margin:0 0 18px;font-size:14px}.archive-recovery-banner a{color:#224d74}'''
            (soup.head or soup).append(st)
            return added

          summaries=[]
          for name,slug in TARGETS.items():
            rec=byname[name];spec=rec.get('spec') or {};ts=spec.get('timestamp');orig=spec.get('original') or rec['original']
            if not ts:raise RuntimeError(f'No timestamp for {name}')
            raw=wayback_raw(ts,orig);r=fetch(raw,60)
            if not hasattr(r,'status_code') or r.status_code!=200:raise RuntimeError(f'Could not fetch source for {name}: {r}')
            txt=r.text
            if '<html' not in txt.lower() and '<!doctype' not in txt.lower():raise RuntimeError(f'Non-HTML source for {name}')
            soup=BeautifulSoup(txt,'html.parser')
            for t in soup.find_all(['script','iframe','object','embed']):t.decompose()
            for m in soup.find_all('meta'):
              if (m.get('http-equiv') or '').lower()=='refresh':m.decompose()
            for base_tag in soup.find_all('base'):base_tag.decompose()
            css_count=len(inline_styles(soup,ts,orig))

            outdir=os.path.join('recovered',slug);imgdir=os.path.join(outdir,'images');os.makedirs(imgdir,exist_ok=True)
            mapping={};downloaded={};failed={}
            refs=[]
            attrs=('src','data-src','data-orig-src','data-muse-src','data-hidpi-src')
            for tag in soup.find_all(['img','source']):
              for at in attrs:
                v=(tag.get(at) or '').strip()
                if v and image_ext.search(v):refs.append(urljoin(orig,v))
              ss=(tag.get('srcset') or '').strip()
              if ss:
                for bit in ss.split(','):
                  v=bit.strip().split()[0] if bit.strip() else ''
                  if v and image_ext.search(v):refs.append(urljoin(orig,v))
            for a in soup.find_all('a',href=True):
              v=a['href'].strip()
              if image_ext.search(v):refs.append(urljoin(orig,v))
            refs=list(dict.fromkeys(refs))

            for u in refs:
              if '/images/blank.gif' in u.lower():continue
              resp=fetch(wayback_raw(ts,u),45)
              ok=False
              if hasattr(resp,'status_code') and resp.status_code==200:
                ct=(resp.headers.get('content-type') or '').lower()
                data=resp.content
                if len(data)>150 and ('image/' in ct or data[:8] in (b'\x89PNG\r\n\x1a\n',) or data[:2]==b'\xff\xd8'):
                  fn=safe_name(u);open(os.path.join(imgdir,fn),'wb').write(data);mapping[u]='images/'+fn;downloaded[u]=len(data);ok=True
              if not ok:failed[u]=getattr(resp,'status_code',None)

            def local_for(v):
              if not v:return None
              u=urljoin(orig,v.strip())
              return mapping.get(u)
            for tag in soup.find_all(['img','source']):
              # Prefer lazy/original source over blank placeholder.
              preferred=None
              for at in ('data-orig-src','data-muse-src','data-src','src'):
                lv=local_for(tag.get(at))
                if lv:preferred=lv;break
              if preferred and tag.name=='img':tag['src']=preferred
              elif tag.name=='img' and '/blank.gif' in (tag.get('src') or '').lower():tag.attrs.pop('src',None)
              for at in ('data-orig-src','data-muse-src','data-src','data-hidpi-src'):
                tag.attrs.pop(at,None)
              if tag.get('srcset'):
                new=[]
                for bit in tag['srcset'].split(','):
                  bits=bit.strip().split()
                  if not bits:continue
                  lv=local_for(bits[0])
                  if lv:new.append(' '.join([lv]+bits[1:]))
                if new:tag['srcset']=', '.join(new)
                else:tag.attrs.pop('srcset',None)
            for a in soup.find_all('a',href=True):
              lv=local_for(a['href'])
              if lv:a['href']=lv

            # Remove any remaining automatic external resource fetches.
            for tag in soup.find_all(['img','source']):
              if tag.get('src') and str(tag['src']).startswith(('http://','https://')):tag.attrs.pop('src',None)
              if tag.get('srcset') and ('http://' in tag['srcset'] or 'https://' in tag['srcset']):tag.attrs.pop('srcset',None)
            for link in soup.find_all('link',href=True):
              if str(link['href']).startswith(('http://','https://')):link.decompose()

            banner=soup.new_tag('div',attrs={'class':'archive-recovery-banner'})
            banner.append(BeautifulSoup('<strong>Recovered archive copy.</strong> Text and archived images are served locally from this preservation site; scripts and automatic external requests have been removed. <a href="../../atoz-archive.html">Return to the A–Z index</a>.','html.parser'))
            if soup.body:soup.body.insert(0,banner)
            else:soup.insert(0,banner)
            open(os.path.join(outdir,'index.html'),'w',encoding='utf-8').write(str(soup))
            summaries.append({'name':name,'slug':slug,'source_timestamp':ts,'source_url':orig,'image_references':len(refs),'images_downloaded':len(downloaded),'images_failed':len(failed),'failed_urls':list(failed),'stylesheets_inlined':css_count,'text_chars':len(' '.join(soup.stripped_strings))})
            print(name,'downloaded',len(downloaded),'failed',len(failed),flush=True)

          json.dump({'pages':summaries},open('catalogue-audit/priority-local-reconstructions.json','w'),indent=2,ensure_ascii=False)

          # Point catalogue entries to local copies only when reconstruction actually exists.
          name_to_target={x['name']:'recovered/'+x['slug']+'/' for x in summaries}
          changed={}
          for part in ['atoz-part1.html','atoz-part2.html','atoz-part3.html','atoz-part4.html','atoz-part5.html']:
            soup=BeautifulSoup(open(part,encoding='utf-8').read(),'html.parser');n=0
            for sec in soup.find_all('section'):
              h2=sec.find('h2')
              if not h2 or len(h2.get_text(' ',strip=True))!=1:continue
              for a in sec.find_all('a',href=True):
                nm=a.get_text(' ',strip=True)
                if nm in name_to_target and a['href']!=name_to_target[nm]:a['href']=name_to_target[nm];n+=1
            if n:open(part,'w',encoding='utf-8').write(str(soup))
            changed[part]=n
          json.dump({'pages':summaries,'index_changes':changed},open('catalogue-audit/priority-local-reconstructions-summary.json','w'),indent=2,ensure_ascii=False)
          PY
          python /tmp/rebuild.py
      - name: Commit recovered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/ catalogue-audit/priority-local-reconstructions*.json atoz-part1.html atoz-part2.html atoz-part3.html atoz-part4.html atoz-part5.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Reconstruct five priority pages with local archived assets' && git pull --rebase && git push; fi
