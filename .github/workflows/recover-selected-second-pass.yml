name: Reconcile selected recovered photographs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: selected-photo-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pillow
      - name: Reconcile exact local photographs and write summary
        run: python scripts/reconcile_selected_images.py
      - name: Validate generated reports
        run: |
          python -m json.tool page-audit/selected-second-pass-summary.json >/dev/null
          git diff --check
      - name: Commit reconciled results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered page-audit/selected-second-pass-summary.json
          if git diff --cached --quiet; then echo 'No new changes'; exit 0; fi
          git commit -m 'Repair selected photo recovery reconciliation'
          git pull --rebase origin main
          git push origin HEAD:main
