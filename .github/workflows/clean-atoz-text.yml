name: Clean recovered A-Z text encoding

on:
  push:
    paths:
      - '.github/workflows/clean-atoz-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Repair mojibake and verify links
        run: |
          cat > /tmp/clean.py <<'PY'
          from bs4 import BeautifulSoup
          import json, re
          files=['atoz-part2.html','atoz-part3.html','atoz-part4.html','atoz-part5.html']
          report={}
          for fn in files:
            raw=open(fn,encoding='utf-8').read()
            soup=BeautifulSoup(raw,'html.parser')
            fixed=0
            for node in list(soup.find_all(string=True)):
              s=str(node)
              if any(x in s for x in ('â','Ã','Â','ð','\x80','\x99')):
                try:
                  corrected=s.encode('latin1').decode('utf-8')
                except Exception:
                  corrected=s
                if corrected != s:
                  node.replace_with(corrected); fixed+=1
            # Give Y and Z unique ids while preserving the original combined XYZ landing point at Y.
            if fn=='atoz-part5.html':
              secs=soup.find_all('section')
              yz=[s for s in secs if s.find('h2') and s.find('h2').get_text(strip=True) in ('Y','Z')]
              for sec in yz:
                letter=sec.find('h2').get_text(strip=True)
                sec['id']='xyz' if letter=='Y' else 'z'
            out=str(soup)
            open(fn,'w',encoding='utf-8').write(out)
            report[fn]={'text_nodes_fixed':fixed,'mojibake_markers_remaining':sum(out.count(x) for x in ('â','Ã','Â'))}
          open('index-recovery/encoding-report.json','w',encoding='utf-8').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          python /tmp/clean.py
      - name: Commit cleaned pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atoz-part2.html atoz-part3.html atoz-part4.html atoz-part5.html index-recovery/encoding-report.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Clean recovered A-Z text encoding' && git push; fi
