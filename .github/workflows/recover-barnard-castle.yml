name: Recover Barnard Castle
# parallel image recovery

on:
  push:
    paths:
      - '.github/workflows/recover-barnard-castle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barnard-castle-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow ftfy
      - run: python scripts/recover_barnard_castle.py
      - run: python scripts/verify_barnard_castle.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/barnard-castle atoz-part1.html
          git commit -m 'Publish recovered Barnard Castle page'
          git pull --rebase origin main
          git push origin HEAD:main
