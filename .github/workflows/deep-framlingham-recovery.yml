name: Framlingham deep recovery

on:
  push:
    paths:
      - '.github/workflows/deep-framlingham-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/deep_framlingham_recovery.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/framlingham-castle page-audit/framlingham-castle.json
          if git diff --cached --quiet; then
            echo 'No Framlingham recovery changes'
          else
            git commit -m 'Complete deep Framlingham image recovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
