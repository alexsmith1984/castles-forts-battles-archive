name: Recover archived Baddesley images

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Query CDX and recover missing images
        shell: bash
        run: |
          set -u
          mkdir -p recovered-images
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request, time
          from pathlib import Path

          stems = {
            'baddesley_clinton_plan': [
              'images/baddesley_clinton_plan.jpg','images/baddesley_clinton_plan200x191.jpg','images/baddesley_clinton_plan201x192.jpg','images/baddesley_clinton_plan266x254.jpg','assets/baddesley_clinton_plan.png'],
            'baddesley_castle5': [
              'images/baddesley_castle5.jpg','images/baddesley_castle501x239.jpg','images/baddesley_castle502x239.jpg','images/baddesley_castle5241x161.jpg','images/baddesley_castle5242x161.jpg','images/baddesley_castle5320x214.jpg','images/baddesley_castle5321x214.jpg','images/baddesley_castle560x40.jpg','assets/baddesley_castle5.jpg'],
            'baddesley_castle9': [
              'images/baddesley_castle9.jpg','images/baddesley_castle9a.jpg','images/baddesley_castle9128x162.jpg','images/baddesley_castle9170x215.jpg','images/baddesley_castle936x45.jpg','assets/baddesley_castle9.jpg'],
            'baddesley_castle24': [
              'images/baddesley_castle24.jpg','images/baddesley_castle24244x163.jpg','images/baddesley_castle24324x216.jpg','images/baddesley_castle2463x309.jpg','assets/baddesley_castle24.jpg'],
            'baddesley_castle23': [
              'images/baddesley_castle23.jpg','images/baddesley_castle23244x163.jpg','images/baddesley_castle23245x163.jpg','images/baddesley_castle23324x216.jpg','images/baddesley_castle23325x217.jpg','images/baddesley_castle2360x40.jpg','images/baddesley_castle2398x265.jpg','images/baddesley_castle2398x266.jpg','assets/baddesley_castle23.jpg'],
            'baddesley_castle10': [
              'images/baddesley_castle10.jpg','images/baddesley_castle10256x171.jpg','images/baddesley_castle10257x171.jpg','images/baddesley_castle10340x227.jpg','images/baddesley_castle10341x227.jpg','images/baddesley_castle1060x40.jpg','assets/baddesley_castle10.jpg'],
            'baddesley_castle12': [
              'images/baddesley_castle12.jpg','images/baddesley_castle12256x171.jpg','images/baddesley_castle12257x171.jpg','images/baddesley_castle12340x227.jpg','images/baddesley_castle12341x227.jpg','images/baddesley_castle1260x40.jpg','assets/baddesley_castle12.jpg'],
            'baddesley_castle14_priest_hole': [
              'images/baddesley_castle14_priest_hole.jpg','images/baddesley_castle14_priest_hole222x333.jpg','images/baddesley_castle14_priest_hole232x348.jpg','images/baddesley_castle14_priest_hole233x349.jpg','images/baddesley_castle14_priest_hole308x462.jpg','images/baddesley_castle14_priest_hole309x463.jpg','images/baddesley_castle14_priest_hole30x46.jpg','assets/baddesley_castle14_priest_hole.jpg']
          }
          hosts = ['www.castlesfortsbattles.co.uk','castlesfortsbattles.co.uk']
          schemes = ['http','https']
          report=[]
          all_cdx={}

          def cdx(original):
              q = urllib.parse.urlencode({'url': original, 'output':'json', 'fl':'timestamp,original,mimetype,statuscode,digest,length', 'filter':'statuscode:200', 'collapse':'digest'})
              url='https://web.archive.org/cdx/search/cdx?'+q
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 archive recovery'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      data=json.load(r)
                  rows=data[1:] if data and isinstance(data[0],list) else []
                  return rows
              except Exception as e:
                  report.append(f'CDX ERROR {original}: {e}')
                  return []

          def download(ts, original, out):
              for mod in ('id_','im_'):
                  url=f'https://web.archive.org/web/{ts}{mod}/{original}'
                  tmp=Path('/tmp/candidate.bin')
                  try:
                      subprocess.run(['curl','-L','--fail','--silent','--show-error','--retry','2','--retry-all-errors','--connect-timeout','20','--max-time','90','-A','Mozilla/5.0 archive recovery',url,'-o',str(tmp)], check=True)
                      mime=subprocess.check_output(['file','--mime-type','-b',str(tmp)], text=True).strip()
                      size=tmp.stat().st_size
                      if mime.startswith('image/') and size > 1500:
                          out.write_bytes(tmp.read_bytes())
                          return url,mime,size
                  except Exception:
                      pass
              return None

          for stem, rels in stems.items():
              candidates=[]
              for rel in rels:
                  for host in hosts:
                      for scheme in schemes:
                          original=f'{scheme}://{host}/midlands/{rel}'
                          rows=cdx(original)
                          if rows:
                              all_cdx[original]=rows
                          for row in rows:
                              ts,orig,mime,status,digest,length=row
                              try: length_i=int(length)
                              except: length_i=0
                              candidates.append((length_i, ts, orig, mime, digest))
                          time.sleep(0.15)
              # Prefer largest archived copy first; exact/full-size resources naturally tend to win.
              candidates.sort(reverse=True)
              found=None
              for length_i,ts,orig,mime,digest in candidates:
                  ext='.png' if 'png' in mime.lower() or orig.lower().endswith('.png') else '.jpg'
                  out=Path('recovered-images')/(stem+ext)
                  got=download(ts,orig,out)
                  if got:
                      found=(out,got,ts,orig,digest,length_i)
                      break
              if found:
                  out,got,ts,orig,digest,length_i=found
                  url,mime,size=got
                  report.append(f'RECOVERED {stem}: {out} | {size} bytes | {mime} | capture {ts} | {orig} | replay {url}')
              else:
                  report.append(f'MISSING {stem}: CDX candidates={len(candidates)}')

          Path('cdx-recovery-report.txt').write_text('\n'.join(report)+'\n')
          Path('cdx-candidates.json').write_text(json.dumps(all_cdx, indent=2))
          print('\n'.join(report))
          PY

      - name: Commit recovery results to the PR branch
        shell: bash
        run: |
          git config user.name 'archive-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-images cdx-recovery-report.txt cdx-candidates.json
          if git diff --cached --quiet; then
            echo 'No recovery results changed.'
          else
            git commit -m 'Recover missing Baddesley Clinton images via CDX'
            git push origin HEAD:${{ github.head_ref }}
          fi
