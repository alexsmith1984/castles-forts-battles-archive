name: Inspect Berkhamsted Castle
# rerun after URL fix

on:
  push:
    paths:
      - '.github/workflows/inspect-berkhamsted-castle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berkhamsted-castle-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/inspect_berkhamsted_castle.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add page-audit/berkhamsted-castle
          if git diff --cached --quiet; then
            echo 'No inspection changes'
          else
            git commit -m 'Audit Berkhamsted Castle archived source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
