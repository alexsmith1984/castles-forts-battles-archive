name: Recover A-Z index sources

on:
  push:
    paths:
      - '.github/workflows/recover-atoz-indexes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Recover index pages
        run: |
          cat > /tmp/recover.py <<'PY'
          import json, os, time
          from urllib.parse import urljoin, urlsplit, urlunsplit
          import requests
          from bs4 import BeautifulSoup

          OUT='index-recovery'
          os.makedirs(OUT, exist_ok=True)
          targets = [
            ('atoz_part2', '20211024064212', 'http://www.castlesfortsbattles.co.uk/atoz_part2.html'),
            ('atoz_part3', '20210618031200', 'https://www.castlesfortsbattles.co.uk/atoz_part3.html'),
            ('atoz_part4', '20211024063128', 'http://www.castlesfortsbattles.co.uk/atoz_part4.html'),
            ('atoz_part5', '20211024051446', 'http://www.castlesfortsbattles.co.uk/atoz_part5.html'),
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; archival-recovery/1.0)'})

          def get(url, timeout=45):
            for attempt in range(5):
              try:
                r=session.get(url,timeout=timeout,allow_redirects=True)
                if r.status_code==200 and len(r.content)>500:
                  return r
              except Exception:
                pass
              time.sleep(2+attempt*3)
            return None

          def cdx_exact(original):
            api='https://web.archive.org/cdx/search/cdx'
            params={'url':original,'output':'json','filter':['statuscode:200','mimetype:text/html'],'fl':'timestamp,original,statuscode,mimetype,digest','collapse':'digest'}
            try:
              r=session.get(api,params=params,timeout=60)
              if r.status_code==200:
                data=r.json()
                return data[1:] if isinstance(data,list) and len(data)>1 else []
            except Exception:
              pass
            return []

          report=[]
          for name, preferred_ts, original in targets:
            candidates=[(preferred_ts,original)]
            variants=[]
            sp=urlsplit(original)
            hosts=[sp.netloc, sp.netloc[4:] if sp.netloc.startswith('www.') else 'www.'+sp.netloc]
            for scheme in ('http','https'):
              for host in hosts:
                variants.append(urlunsplit((scheme,host,sp.path,sp.query,'')))
            for alt in variants:
              for row in reversed(cdx_exact(alt)):
                if len(row)>=2 and (row[0],row[1]) not in candidates:
                  candidates.append((row[0],row[1]))
            chosen=None; raw=None; replay=None
            for ts, orig in candidates[:40]:
              for modifier in ('id_',''):
                u=f'https://web.archive.org/web/{ts}{modifier}/{orig}'
                r=get(u)
                if r is not None:
                  text=r.text
                  if '<html' in text.lower() or '<!doctype' in text.lower():
                    chosen=(ts,orig,modifier)
                    raw=text
                    replay=r.url
                    break
              if raw: break
            if not raw:
              report.append({'name':name,'status':'FAILED','candidates':len(candidates)})
              continue
            with open(f'{OUT}/{name}.source.html','w',encoding='utf-8',errors='replace') as f:
              f.write(raw)
            soup=BeautifulSoup(raw,'html.parser')
            links=[]; seen=set(); base=chosen[1]
            for a in soup.find_all('a',href=True):
              href=a.get('href','').strip()
              text=' '.join(a.stripped_strings).strip()
              title=(a.get('title') or '').strip()
              if not text:
                img=a.find('img')
                if img:
                  text=(img.get('alt') or '').strip()
              if href.startswith(('javascript:','mailto:','tel:')):
                continue
              absolute=urljoin(base,href)
              key=(text,title,absolute)
              if key in seen:
                continue
              seen.add(key)
              links.append({'text':text,'title':title,'href':href,'absolute':absolute})
            with open(f'{OUT}/{name}.links.json','w',encoding='utf-8') as f:
              json.dump({'name':name,'capture':chosen,'replay':replay,'links':links},f,ensure_ascii=False,indent=2)
            visible='\n'.join(s.strip() for s in soup.stripped_strings if s.strip())
            with open(f'{OUT}/{name}.text.txt','w',encoding='utf-8') as f:
              f.write(visible)
            report.append({'name':name,'status':'OK','capture':chosen,'replay':replay,'bytes':len(raw.encode('utf-8')),'links':len(links)})
            time.sleep(3)
          with open(f'{OUT}/report.json','w',encoding='utf-8') as f:
            json.dump(report,f,indent=2)
          with open(f'{OUT}/report.txt','w',encoding='utf-8') as f:
            for x in report:
              f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2))
          PY
          python /tmp/recover.py
      - name: Commit recovered material
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-recovery/
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Recover A-Z index source material'
            git push
          fi

