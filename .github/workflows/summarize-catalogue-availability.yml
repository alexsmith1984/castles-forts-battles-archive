name: Summarize complete catalogue availability

on:
  push:
    paths:
      - '.github/workflows/summarize-catalogue-availability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Merge catalogue availability results
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter
          base=json.load(open('catalogue-audit/cdx-fast.json',encoding='utf-8'))['results']
          first={r['original']:r for r in json.load(open('catalogue-audit/availability-unresolved.json',encoding='utf-8'))['results']}
          slow={r['original']:r for r in json.load(open('catalogue-audit/availability-slow-retry.json',encoding='utf-8'))['results']}
          out=[]
          for r in base:
            z={'primary_name':r['primary_name'],'aliases':r.get('aliases',[]),'original':r['original']}
            if r['state']=='reconstructed_local':
              z.update({'availability':'reconstructed_local','best_replay':'baddesley-clinton-final.html','source':'local'})
            elif r['state']=='indexed_html_capture':
              z.update({'availability':'snapshot_found','best_replay':r.get('best_replay'),'timestamp':r.get('capture_timestamp'),'source':'cdx'})
            else:
              a=first.get(r['original'],{})
              if a.get('resolution')=='available_via_api':
                z.update({'availability':'snapshot_found','best_replay':a.get('best_replay'),'timestamp':a.get('capture_timestamp'),'source':'availability'})
              elif a.get('resolution')=='no_snapshot_via_availability_api':
                z.update({'availability':'no_snapshot_found','source':'availability'})
              else:
                q=slow.get(r['original'],{})
                if q.get('slow_resolution')=='available':z.update({'availability':'snapshot_found','best_replay':q.get('best_replay'),'timestamp':q.get('capture_timestamp'),'source':'slow_retry'})
                elif q.get('slow_resolution')=='no_snapshot_found':z.update({'availability':'no_snapshot_found','source':'slow_retry'})
                else:z.update({'availability':'inconclusive','source':'unresolved'})
            out.append(z)
          states=Counter(x['availability'] for x in out);no=[x for x in out if x['availability']=='no_snapshot_found'];inc=[x for x in out if x['availability']=='inconclusive']
          summary={'unique_destinations':len(out),'availability':dict(states),'no_snapshot_pages':[{'name':x['primary_name'],'aliases':x['aliases'],'original':x['original']} for x in no],'inconclusive_pages':[{'name':x['primary_name'],'original':x['original']} for x in inc]}
          os.makedirs('catalogue-audit',exist_ok=True)
          json.dump({'summary':summary,'results':out},open('catalogue-audit/availability-complete.json','w'),indent=2,ensure_ascii=False)
          json.dump(summary,open('catalogue-audit/availability-complete-summary.json','w'),indent=2,ensure_ascii=False)
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit availability summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue-audit/availability-complete*.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Summarize catalogue Wayback availability' && git pull --rebase && git push; fi
