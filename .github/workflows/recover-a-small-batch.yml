name: Fetch Abergavenny source
on:
  push:
    paths:
      - '.github/workflows/recover-a-small-batch.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - name: Fetch known working 2018 source
        run: |
          python - <<'PY'
          import requests,json,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          u='https://web.archive.org/web/20180804035317id_/http://www.castlesfortsbattles.co.uk:80/south_wales/abergavenny_castle.html'
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          r=s.get(u,timeout=30,allow_redirects=True)
          if r.status_code!=200 or '<html' not in r.text.lower():raise SystemExit(f'source failed {r.status_code}')
          out=Path('recovered/abergavenny-castle');out.mkdir(parents=True,exist_ok=True)
          out.joinpath('source.html').write_text(r.text,encoding='utf-8',errors='replace')
          soup=BeautifulSoup(r.text,'html.parser')
          imgs=[]
          for im in soup.find_all('img'):
            imgs.append({'src':im.get('src'),'alt':im.get('alt'),'title':im.get('title'),'width':im.get('width'),'height':im.get('height')})
          links=[]
          for a in soup.find_all('a',href=True):
            if re.search(r'\.(jpg|jpeg|png|gif)(?:\?|$)',a['href'],re.I):links.append({'href':a['href'],'text':' '.join(a.stripped_strings)})
          report={'source':u,'bytes':len(r.content),'text_chars':len(' '.join(soup.stripped_strings)),'images':imgs,'image_links':links}
          out.joinpath('source-analysis.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print('bytes',len(r.content),'imgs',len(imgs),'image links',len(links))
          PY
      - name: Commit source analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/abergavenny-castle/source.html recovered/abergavenny-castle/source-analysis.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Fetch Abergavenny Castle archived source' && git pull --rebase && git push; fi
