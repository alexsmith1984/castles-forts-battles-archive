name: Kenilworth exhaustive image recovery

on:
  push:
    paths:
      - '.github/workflows/deep-kenilworth-exhaustive.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/prepare_kenilworth_engine.py
      - run: python /tmp/deep_kenilworth.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/kenilworth-castle page-audit/kenilworth-castle.json
          if git diff --cached --quiet; then
            echo 'No Kenilworth recovery changes'
          else
            git commit -m 'Complete exhaustive Kenilworth image recovery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
