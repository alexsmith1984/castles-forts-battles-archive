name: PR run and watch Richard's Castle finalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  finalize-and-watch:
    if: contains(github.event.pull_request.title, '[richards-finalize]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run finalize-richards-castle.yml --repo "${{ github.repository }}" --ref main
          sleep 5
      - name: Find and watch dispatched run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(gh run list --repo "${{ github.repository }}" --workflow finalize-richards-castle.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RID"
          echo "Watching finalization run $RID"
          gh run watch "$RID" --repo "${{ github.repository }}" --exit-status
