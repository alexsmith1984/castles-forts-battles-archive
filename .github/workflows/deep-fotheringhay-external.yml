name: Fotheringhay external archive search

on:
  push:
    paths:
      - '.github/workflows/deep-fotheringhay-external.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/deep_fotheringhay_external_archives.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/fotheringhay-castle
          if git diff --cached --quiet; then
            echo 'No Fotheringhay archive changes'
          else
            git commit -m 'Complete fresh Fotheringhay external archive search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
