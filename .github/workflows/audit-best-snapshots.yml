name: Find best Wayback snapshot for every catalogue destination

on:
  push:
    paths:
      - '.github/workflows/audit-best-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Resolve closest late-2022 snapshots
        run: |
          cat > /tmp/best.py <<'PY'
          import json, os, threading
          from urllib.parse import urlsplit, urlunsplit
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import Counter
          import requests

          base=json.load(open('catalogue-audit/cdx-fast.json',encoding='utf-8'))['results']
          local=threading.local()
          def session():
            if not hasattr(local,'s'):
              local.s=requests.Session();local.s.headers['User-Agent']='Mozilla/5.0 (CastlesFortsBattles archival audit)'
            return local.s
          def variants(u):
            sp=urlsplit(u);h0=sp.netloc[4:] if sp.netloc.startswith('www.') else sp.netloc
            out=[]
            for sch in ('http','https'):
              for h in ('www.'+h0,h0):
                v=urlunsplit((sch,h,sp.path,sp.query,''))
                if v not in out:out.append(v)
            if u in out:out.remove(u);out.insert(0,u)
            return out
          def query(u):
            try:
              r=session().get('https://archive.org/wayback/available',params={'url':u,'timestamp':'20220922'},timeout=15)
              if r.status_code in (429,500,502,503,504):return {'state':'service_error','http':r.status_code,'query':u}
              if r.status_code!=200:return {'state':'http_error','http':r.status_code,'query':u}
              d=r.json();c=((d.get('archived_snapshots') or {}).get('closest') or {})
              if c.get('available') and c.get('url'):
                return {'state':'available','query':u,'snapshot_url':c['url'],'timestamp':c.get('timestamp'),'status':c.get('status')}
              return {'state':'none','query':u}
            except requests.Timeout:return {'state':'service_error','error':'timeout','query':u}
            except Exception as ex:return {'state':'service_error','error':type(ex).__name__+': '+str(ex)[:160],'query':u}
          def one(rec):
            if rec['state']=='reconstructed_local':
              return {**rec,'best_state':'reconstructed_local','best_replay':'baddesley-clinton-final.html'}
            attempts=[]
            for v in variants(rec['original']):
              a=query(v);attempts.append(a)
              if a['state']=='available':
                return {**rec,'best_state':'available','resolved_variant':v,'best_replay':a['snapshot_url'],'best_timestamp':a.get('timestamp'),'attempts':attempts}
              if a['state']=='service_error':
                return {**rec,'best_state':'inconclusive_service_error','attempts':attempts}
            return {**rec,'best_state':'no_snapshot_found','attempts':attempts}

          results=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
            futs={ex.submit(one,r):r for r in base}
            for i,f in enumerate(as_completed(futs),1):
              try:results.append(f.result())
              except Exception as exc:
                r=futs[f];results.append({**r,'best_state':'inconclusive_exception','error':repr(exc)})
              if i%50==0:print(i,'/',len(base),Counter(x['best_state'] for x in results),flush=True)
          results.sort(key=lambda r:r['primary_name'].casefold())
          summary={'unique_destinations':len(results),'states':dict(Counter(r['best_state'] for r in results)),
                   'target_date':'2022-09-22','method':'Wayback availability API; original URL first, then http/https and www/non-www variants. Service errors are inconclusive.'}
          os.makedirs('catalogue-audit',exist_ok=True)
          json.dump({'summary':summary,'results':results},open('catalogue-audit/best-snapshots.json','w'),indent=2,ensure_ascii=False)
          json.dump(summary,open('catalogue-audit/best-snapshots-summary.json','w'),indent=2,ensure_ascii=False)
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/best.py
      - name: Commit snapshot map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue-audit/best-snapshots*.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Map best Wayback snapshots for catalogue' && git pull --rebase && git push; fi
