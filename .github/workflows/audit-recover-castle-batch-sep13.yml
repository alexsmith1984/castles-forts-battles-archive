name: Audit and recover incomplete castle pages
# parallelized final pass

on:
  push:
    paths:
      - ".github/workflows/audit-recover-castle-batch-sep13.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: castle-batch-sep13
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow ftfy
      - run: python scripts/audit_recover_castle_batch_sep13.py
      - run: python scripts/verify_castle_batch_sep13.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered page-audit/castle-image-audit-batch-2026-09-13.json atoz-part1.html atoz-part2.html atoz-part3.html atoz-part4.html atoz-part5.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Audit and recover incomplete castle pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
