name: Recover Castle Rising Castle

on:
  push:
    paths:
      - '.github/workflows/recover-castle-rising.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow ftfy
      - name: Recover and reconstruct Castle Rising
        run: python scripts/recover_castle_rising.py
      - name: Commit recovered page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/castle-rising-castle atoz-part1.html
          if git diff --cached --quiet; then
            echo "No page changes"
          else
            git commit -m "Publish recovered Castle Rising Castle page"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
