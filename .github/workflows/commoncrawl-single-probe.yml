name: Common Crawl low-rate probe

on:
  push:
    paths:
      - '.github/workflows/commoncrawl-single-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe August 2019 index slowly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cc-probe
          python3 - <<'PY'
          import json,time,urllib.parse,urllib.request
          from pathlib import Path
          pat='www.castlesfortsbattles.co.uk/midlands/assets/baddesley*'
          url='https://index.commoncrawl.org/CC-MAIN-2019-35-index?'+urllib.parse.urlencode({'url':pat,'output':'json'})
          attempts=[]; body=''
          for i in range(8):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'castles-forts-battles-archive-recovery/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','replace'); attempts.append({'attempt':i+1,'status':r.status,'ok':True,'body_preview':body[:500]}); break
              except Exception as e:
                  attempts.append({'attempt':i+1,'ok':False,'error':repr(e)})
                  time.sleep(8)
          rows=[]
          for ln in body.splitlines():
              try: rows.append(json.loads(ln))
              except: pass
          Path('cc-probe/report.json').write_text(json.dumps({'url':url,'attempts':attempts,'rows':rows},indent=2))
          Path('cc-probe/report.txt').write_text(f'accepted={bool(body)} rows={len(rows)} attempts={len(attempts)}\n'+('\n'.join(r.get('url','') for r in rows))+'\n')
          print(Path('cc-probe/report.txt').read_text())
          PY
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name archive-recovery-bot
          git config user.email actions@users.noreply.github.com
          git add cc-probe
          git commit -m 'Common Crawl low-rate probe result' || exit 0
          git pull --rebase origin main
          git push
