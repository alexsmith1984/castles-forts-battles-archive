name: Inspect Tutbury Castle 2022 capture
on:
  push:
    paths:
      - '.github/workflows/tutbury-inspect-2022.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python scripts/inspect_tutbury_2022.py
      - name: Save inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/tutbury-castle/source.html page-audit/tutbury-inspection.json
          if git diff --cached --quiet; then echo No changes; else git commit -m 'Preserve Tutbury 2022 archive source and image inventory'; git pull --rebase origin main; git push origin HEAD:main; fi
