name: Extend source inventory after slow Wayback retry

on:
  push:
    paths:
      - 'catalogue-audit/availability-slow-retry.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Fetch newly resolved page sources
        run: |
          cat > /tmp/extend.py <<'PY'
          import json, os, re, threading
          from urllib.parse import urljoin,urlsplit
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from bs4 import BeautifulSoup

          inv=json.load(open('catalogue-audit/source-inventory.json',encoding='utf-8'))
          retry=json.load(open('catalogue-audit/availability-slow-retry.json',encoding='utf-8'))['results']
          newly={r['original']:r for r in retry if r.get('slow_resolution')=='available'}
          wb_re=re.compile(r'https?://web\.archive\.org/web/(\d+)(?:[a-z_]+)?/(https?://.+)',re.I)
          image_re=re.compile(r'\.(?:jpe?g|png|gif|webp|bmp|tiff?)(?:[?#].*)?$',re.I)
          local=threading.local()
          def sess():
            if not hasattr(local,'s'):
              local.s=requests.Session();local.s.headers['User-Agent']='Mozilla/5.0 (CastlesFortsBattles source audit extension)'
            return local.s
          def nm(v,base):
            if not v or v.startswith(('data:','javascript:','#')) or not image_re.search(v):return None
            u=urljoin(base,v.strip());low=u.lower()
            return None if '/images/blank.gif' in low or low.endswith('/blank.gif') else u
          def extract(txt,base):
            soup=BeautifulSoup(txt,'html.parser');vis=' '.join(soup.stripped_strings)
            assets=[];lazy=[];srcs=[];allr=[]
            for a in soup.find_all('a',href=True):
              u=nm(a.get('href'),base)
              if u:
                allr.append(u)
                if '/assets/' in urlsplit(u).path.lower():assets.append(u)
            for tag in soup.find_all(['img','source']):
              for at in ('data-orig-src','data-muse-src','data-src','data-hidpi-src'):
                u=nm(tag.get(at),base)
                if u:lazy.append(u);allr.append(u)
              u=nm(tag.get('src'),base)
              if u:srcs.append(u);allr.append(u)
              for bit in (tag.get('srcset') or '').split(','):
                v=bit.strip().split()[0] if bit.strip() else ''
                u=nm(v,base)
                if u:allr.append(u)
            def uq(x):return list(dict.fromkeys(x))
            assets,lazy,srcs,allr=map(uq,(assets,lazy,srcs,allr))
            return {'text_chars':len(vis),'asset_links':assets,'lazy_images':lazy,'img_src_images':srcs,'all_media':allr,'asset_link_count':len(assets),'lazy_image_count':len(lazy),'img_src_count':len(srcs),'all_media_count':len(allr),'uses_blank_lazy':('blank.gif' in txt.lower() and any(x in txt for x in ('data-orig-src','data-muse-src','data-src')))}
          def one(rec):
            r=newly[rec['original']];u=r.get('best_replay','');m=wb_re.match(u)
            if not m:return rec
            ts,orig=m.group(1),m.group(2);raw=f'https://web.archive.org/web/{ts}id_/{orig}'
            out=dict(rec);out['spec']={'kind':'wayback','timestamp':ts,'original':orig,'replay':u,'source':'slow_availability_retry'}
            try:
              x=sess().get(raw,timeout=22,allow_redirects=True);txt=x.text
              if x.status_code==200 and ('<html' in txt.lower() or '<!doctype' in txt.lower()):
                out['fetch_state']='source_ok';out['raw_replay']=x.url;out['bytes']=len(x.content);out.update(extract(txt,orig))
              elif x.status_code in (429,500,502,503,504):out['fetch_state']='inconclusive_service_error';out['http']=x.status_code
              else:out['fetch_state']='source_not_retrieved';out['http']=x.status_code
            except Exception as ex:out['fetch_state']='inconclusive_service_error';out['error']=type(ex).__name__+': '+str(ex)[:150]
            return out
          targets=[r for r in inv['results'] if r.get('fetch_state')=='no_known_snapshot' and r['original'] in newly]
          repl={}
          with ThreadPoolExecutor(max_workers=2) as ex:
            futs={ex.submit(one,r):r for r in targets}
            for f in as_completed(futs):
              z=f.result();repl[z['original']]=z
          results=[repl.get(r['original'],r) for r in inv['results']]
          ok=[r for r in results if r.get('fetch_state')=='source_ok']
          summary={'unique_destinations':len(results),'fetch_states':dict(Counter(r.get('fetch_state') for r in results)),'sources_inventoried':len(ok),'newly_attempted':len(targets),'newly_source_ok':sum(1 for r in repl.values() if r.get('fetch_state')=='source_ok'),'pages_with_asset_links':sum(1 for r in ok if r.get('asset_link_count',0)>0),'pages_with_any_media_refs':sum(1 for r in ok if r.get('all_media_count',0)>0),'total_asset_links':sum(r.get('asset_link_count',0) for r in ok),'total_media_refs':sum(r.get('all_media_count',0) for r in ok),'scope':'Extended source inventory including snapshots recovered by the slow availability retry.'}
          json.dump({'summary':summary,'results':results},open('catalogue-audit/source-inventory.json','w'),indent=2,ensure_ascii=False)
          json.dump(summary,open('catalogue-audit/source-inventory-summary.json','w'),indent=2,ensure_ascii=False)
          print(json.dumps(summary,indent=2))
          PY
          python /tmp/extend.py
      - name: Commit extended inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue-audit/source-inventory*.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Extend source inventory with newly resolved snapshots' && git pull --rebase && git push; fi
