name: Sandal targeted final recovery
on:
  push:
    paths:
      - '.github/workflows/sandal-targeted-final-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow beautifulsoup4
      - run: python scripts/recover_sandal_targeted_final.py
      - name: Rebuild Sandal page and audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path('recovered/sandal-castle');r=json.loads((root/'recovery-report.json').read_text())
          p=root/'index.html';soup=BeautifulSoup(p.read_text(),'html.parser')
          h=soup.find('h2',string=lambda x:x and 'Recovered original photographs' in x)
          if h:
              for fig in list(h.find_all_next('figure')):fig.decompose()
              anchor=h
              for x in r['images']:
                  fig=soup.new_tag('figure');a=soup.new_tag('a',href=x['file']);im=soup.new_tag('img',src=x['file'],alt='Sandal Castle archived original image')
                  a.append(im);fig.append(a);cap=soup.new_tag('figcaption');cap.string=x['identity'].replace('_',' ')+(' — lower-resolution archived recovery' if x.get('quality')!='full/near-full' else '');fig.append(cap);anchor.insert_after(fig);anchor=fig
          note=soup.find('div',class_='note')
          if note:note.string=f"Recovered from the archived CastlesFortsBattles page. {len(r['images'])} of {r['original_image_positions_identified']} unique original content images have been recovered; {r['still_missing']} remain unavailable. No unrelated substitute photographs have been introduced."
          p.write_text(str(soup))
          Path('page-audit/sandal-castle.json').write_text(json.dumps({'name':'Sandal Castle','slug':'sandal-castle','status':r['status'],'source':r['source_timestamp_used'],'positions':r['original_image_positions_identified'],'full':r['recovered_full_or_near_full'],'lower':r['recovered_thumbnail_or_lower_resolution'],'missing':r['still_missing'],'missing_identities':[x['identity'] for x in r['missing']]},indent=2)+'\n')
          PY
      - name: Commit Sandal final result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/sandal-castle page-audit/sandal-castle.json
          if git diff --cached --quiet;then echo 'No Sandal changes';else git commit -m 'Run targeted Sandal Castle final recovery';git pull --rebase origin main;git push origin HEAD:main;fi
