name: Run corrected canonical content-image audit

on:
  push:
    paths:
      - '.github/workflows/audit-canonical-content-images-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Audit canonical content images
        run: |
          cat > /tmp/canonical.py <<'PY'
          import json,os,time,re,html
          from urllib.parse import urlsplit
          from collections import defaultdict,Counter
          import requests

          pages=json.load(open('catalogue-audit/source-inventory.json',encoding='utf-8'))['results']
          def hostkey(h):
              h=(h or '').lower()
              return h[4:] if h.startswith('www.') else h
          def norm(u):
              s=urlsplit(u)
              return hostkey(s.netloc)+(s.path or '/').lower()
          def basename(u):
              return (urlsplit(u).path or '').rsplit('/',1)[-1].lower()
          decorative=re.compile(r'(?:castlesfortsbattles|battlefieldsofbritain|twitter|facebook|blank\.gif|logo|favicon|share)',re.I)
          def content_refs(p):
              assets=list(dict.fromkeys(p.get('asset_links',[]) or []))
              if assets:
                  return 'fullsize_assets',assets
              lazy=[u for u in list(dict.fromkeys(p.get('lazy_images',[]) or [])) if not decorative.search(basename(u))]
              if lazy:
                  return 'display_images_lazy',lazy
              src=[u for u in list(dict.fromkeys(p.get('img_src_images',[]) or [])) if not decorative.search(basename(u))]
              return 'display_images',src

          domain_families=sorted(set(hostkey(urlsplit(p['original']).netloc) for p in pages if p.get('fetch_state')=='source_ok' and urlsplit(p['original']).netloc))
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0 (CastlesFortsBattles canonical image audit)'
          exact=set();bybase=defaultdict(list);reports=[]
          for dom in domain_families:
              for h in ['www.'+dom,dom]:
                  try:
                      r=s.get('https://web.archive.org/cdx/search/cdx',params={'url':h+'/*','output':'json','filter':'statuscode:200','fl':'timestamp,original,statuscode,mimetype,digest','collapse':'urlkey'},timeout=180)
                      rep={'host':h,'status':r.status_code,'bytes':len(r.content)}
                      if r.status_code==200:
                          d=r.json();rows=d[1:] if isinstance(d,list) and d else [];rep['rows']=len(rows)
                          for row in rows:
                              if len(row)<2: continue
                              u=row[1];exact.add(norm(u));b=basename(u)
                              if b and b!='index.html':
                                  bybase[(hostkey(urlsplit(u).netloc),b)].append({'timestamp':row[0],'original':u,'mimetype':row[3] if len(row)>3 else ''})
                      reports.append(rep)
                  except Exception as ex:
                      reports.append({'host':h,'error':type(ex).__name__+': '+str(ex)[:160]})
                  time.sleep(1)

          manual={
              'Baddesley Clinton':'reconstructed locally; complete recoverable text; four genuine original photographs',
              'Old Oswestry Hillfort':'user confirmed original replay does not open',
              'Seckington Castle':'user confirmed text opens but photographs are missing',
              'Stafford Castle':'user confirmed page opens but one photograph is missing',
              'Bosworth Field (Battle of - 1485)':'user confirmed page opens but some photographs may be missing'
          }
          results=[]
          for p in pages:
              rec={'primary_name':p['primary_name'],'aliases':p.get('aliases',[]),'original':p['original'],'fetch_state':p.get('fetch_state')}
              if p['primary_name'] in manual: rec['manual_observation']=manual[p['primary_name']]
              if p.get('fetch_state')=='local_reconstruction':
                  rec['content_image_state']='local_reconstruction';results.append(rec);continue
              if p.get('fetch_state')!='source_ok':
                  rec['content_image_state']='source_unavailable';results.append(rec);continue
              method,refs=content_refs(p);rec['method']=method;rec['intended_content_images']=len(refs)
              exact_found=[];alt_found=[];missing=[];dom=hostkey(urlsplit(p['original']).netloc)
              for u in refs:
                  if norm(u) in exact:
                      exact_found.append(u);continue
                  alts=bybase.get((dom,basename(u)),[])
                  if alts:
                      alt_found.append({'requested':u,'alternates':alts[:5]})
                  else:
                      missing.append(u)
              rec.update({'exact_indexed':len(exact_found),'alternate_path_same_filename':len(alt_found),'not_indexed_anywhere_same_filename':len(missing),'missing_images':missing,'alternate_candidates':alt_found})
              if not refs: state='no_content_images_detected'
              elif not missing and not alt_found: state='all_content_images_exactly_indexed'
              elif not missing: state='all_content_images_recoverable_some_via_alternate_path'
              elif len(missing)<len(refs): state='some_content_images_unpreserved'
              else: state='no_content_images_preserved'
              rec['content_image_state']=state;results.append(rec)
          states=Counter(x['content_image_state'] for x in results)
          summary={'destinations':len(results),'source_ok_pages':sum(1 for p in pages if p.get('fetch_state')=='source_ok'),'states':dict(states),'domain_queries':reports,'method':'Uses /assets/ full-size originals where supplied; otherwise non-decorative lazy/display image references. Exact archive matches are preferred; same-filename alternate paths are reported without silent substitution.'}
          os.makedirs('catalogue-audit',exist_ok=True)
          json.dump({'summary':summary,'results':results},open('catalogue-audit/canonical-content-images.json','w'),indent=2,ensure_ascii=False)
          json.dump(summary,open('catalogue-audit/canonical-content-images-summary.json','w'),indent=2,ensure_ascii=False)

          rows=[]
          for r in sorted(results,key=lambda x:x['primary_name'].casefold()):
              state=r['content_image_state'].replace('_',' ')
              if r.get('manual_observation'): state += ' — '+r['manual_observation']
              rows.append('<tr><td>{}</td><td>{}</td><td>{}</td><td>{}</td><td>{}</td></tr>'.format(html.escape(r['primary_name']),html.escape(str(r.get('method',''))),html.escape(str(r.get('intended_content_images',''))),html.escape(str(r.get('not_indexed_anywhere_same_filename',''))),html.escape(state)))
          doc='''<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image completeness audit | Castles, Forts and Battles Archive</title><style>body{font-family:Georgia,"Times New Roman",serif;margin:0;background:#f4f0e6;color:#222}header{background:#3d3528;color:white;padding:24px;text-align:center}main{max-width:1200px;margin:auto;padding:20px}.note{background:white;border-left:4px solid #8b7959;padding:12px;margin-bottom:18px}table{width:100%;border-collapse:collapse;background:white;font-size:14px}th,td{border:1px solid #d7cebd;padding:7px;text-align:left;vertical-align:top}th{background:#eee6d6}tr:nth-child(even){background:#faf8f3}a{color:#224d74}</style></head><body><header><h1>Castles, Forts and Battles — image completeness audit</h1><p>Canonical original/display image preservation</p></header><main><div class="note">For Adobe Muse pages this audit uses linked full-size originals in <code>/assets/</code> where available, avoiding false alarms from missing responsive thumbnails. Older pages without those links are checked from displayed-image references. An indexed file is archival evidence; final visual/byte verification is stricter.</div><p><a href="atoz-archive.html">Back to A–Z index</a></p><table><thead><tr><th>Entry</th><th>Method</th><th>Intended images</th><th>Filename absent from archive</th><th>Status</th></tr></thead><tbody>'''+''.join(rows)+'''</tbody></table></main></body></html>'''
          open('image-audit.html','w',encoding='utf-8').write(doc)
          print(json.dumps({'destinations':summary['destinations'],'source_ok_pages':summary['source_ok_pages'],'states':summary['states']},indent=2))
          PY
          python /tmp/canonical.py
      - name: Commit canonical audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue-audit/canonical-content-images*.json image-audit.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Audit canonical content-image preservation' && git pull --rebase && git push; fi
