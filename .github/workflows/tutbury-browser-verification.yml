name: Tutbury browser source image verification
on:
  push:
    paths:
      - '.github/workflows/tutbury-browser-verification.yml'
permissions:
  contents: write
jobs:
  browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/tutbury_browser_verification.py
      - name: Save verified image improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/tutbury-castle/ page-audit/tutbury-browser-diagnostic.json
          if git diff --cached --quiet; then echo No changes; else git commit -m 'Verify Tutbury original images in archived browser render' && git pull --rebase origin main && git push origin HEAD:main; fi
