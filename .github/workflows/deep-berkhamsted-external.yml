name: Berkhamsted Castle external archive search

on:
  push:
    paths:
      - '.github/workflows/deep-berkhamsted-external.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berkhamsted-castle-external
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/deep_berkhamsted_external_archives.py
      - run: python scripts/verify_berkhamsted_castle.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/berkhamsted-castle
          if git diff --cached --quiet; then
            echo 'No external-archive improvements'
          else
            git commit -m 'Complete Berkhamsted external archive search'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
