name: Inspect Barnard Castle archive source
on:
  push:
    paths:
      - ".github/workflows/inspect-barnard-castle.yml"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/inspect_barnard_castle.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered/barnard-castle/source.html recovered/barnard-castle/source-audit.json
          git commit -m "Audit Barnard Castle archived source"
          git pull --rebase origin main
          git push origin HEAD:main
