name: Link and enhance Aberedw local reconstruction
on:
  push:
    paths:
      - '.github/workflows/link-aberedw-local.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pillow
      - name: Recover known surviving images and preserve local link
        run: |
          python - <<'PY'
          import os,json,re
          from pathlib import Path
          from urllib.parse import urlsplit
          from io import BytesIO
          import requests
          from PIL import Image
          p=Path('atoz-part1.html'); s=p.read_text(encoding='utf-8')
          pat=r'href="https?://web\.archive\.org/web/[^\"]*https?://(?:www\.)?castlesfortsbattles\.co\.uk/central_wales/aberedw_castle\.html"'
          s,_=re.subn(pat,'href="recovered/aberedw-castle/index.html"',s);p.write_text(s,encoding='utf-8')
          out=Path('recovered/aberedw-castle');img=out/'images';img.mkdir(parents=True,exist_ok=True)
          ts='20190216213144'
          urls=[
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle11_manor.jpg?crc=514610365',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle16_manor.jpg?crc=3873354256',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle12_manor500x333.jpg?crc=120573466',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle2_motte.jpg?crc=3956422146',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle3_motte.jpg?crc=4182980585',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle4_motte.jpg?crc=65859273',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle6_motte.jpg?crc=140922779',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle7_motte.jpg?crc=4275628926',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle9_motte.jpg?crc=3896591429',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle10_motte.jpg?crc=516477252',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle13_manor.jpg?crc=3958080387',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle14_manor.jpg?crc=519134751',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle15_manor.jpg?crc=4120971946',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle17_manor.jpg?crc=494087494',
          'http://www.castlesfortsbattles.co.uk:80/central_wales/images/aberedw_castle18.jpg?crc=4122889379']
          sess=requests.Session();sess.headers['User-Agent']='Mozilla/5.0'
          found=[];failed=[]
          for u in urls:
            try:r=sess.get(f'https://web.archive.org/web/{ts}id_/{u}',timeout=18,allow_redirects=True)
            except Exception as e:failed.append({'url':u,'error':type(e).__name__});continue
            ok=False
            if r.status_code==200 and len(r.content)>900:
              try:
                im=Image.open(BytesIO(r.content)); w,h=im.size; ok=w>=100 and h>=100
              except Exception:ok=False
            if ok:
              fn=os.path.basename(urlsplit(u).path);(img/fn).write_bytes(r.content);found.append({'file':'images/'+fn,'url':u,'bytes':len(r.content),'dimensions':[w,h]})
            else:failed.append({'url':u,'status':r.status_code,'bytes':len(r.content)})
          (out/'known-images-report.json').write_text(json.dumps({'capture':ts,'found':found,'failed':failed},indent=2),encoding='utf-8')
          page=out/'index.html'
          if page.exists() and found:
            text=page.read_text(encoding='utf-8')
            figs=''.join('<figure><img src="%s" alt="Aberedw Castle"><figcaption>%s</figcaption></figure>'%(x['file'],os.path.splitext(os.path.basename(x['file']))[0].replace('_',' ')) for x in found)
            if '<p>No original image files could be recovered.</p>' in text:text=text.replace('<p>No original image files could be recovered.</p>',figs)
            if figs not in text and '<h2>Recovered original photographs and images</h2>' in text:text=text.replace('<h2>Recovered original photographs and images</h2>','<h2>Recovered original photographs and images</h2>'+figs)
            text=re.sub(r'0 intended full-size image file\(s\) were recovered and 7 could not be recovered in this pass\.',f'{len(found)} genuine archived display image file(s) were recovered; the seven full-size originals were not preserved.',text)
            page.write_text(text,encoding='utf-8')
          print('found',len(found),'failed',len(failed))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atoz-part1.html recovered/aberedw-castle
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Enhance Aberedw Castle local reconstruction' && git pull --rebase && git push; fi
