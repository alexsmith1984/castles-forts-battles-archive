name: Inspect Castle Hill Halton source
on:
  push:
    paths:
      - '.github/workflows/inspect-castle-hill-halton.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/inspect_castle_hill_halton.py
