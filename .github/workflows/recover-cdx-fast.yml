name: Fast CDX Baddesley recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Query archive image directories once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered-images cdx-prefix
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, subprocess, time
          from pathlib import Path

          targets = [
            'baddesley_clinton_plan','baddesley_castle5','baddesley_castle9',
            'baddesley_castle24','baddesley_castle23','baddesley_castle10',
            'baddesley_castle12','baddesley_castle14_priest_hole'
          ]
          prefixes = [
            'www.castlesfortsbattles.co.uk/midlands/images/',
            'www.castlesfortsbattles.co.uk/midlands/assets/',
            'castlesfortsbattles.co.uk/midlands/images/',
            'castlesfortsbattles.co.uk/midlands/assets/'
          ]
          rows=[]; report=[]
          for i,prefix in enumerate(prefixes):
              params=[('url',prefix),('matchType','prefix'),('output','json'),
                      ('fl','timestamp,original,mimetype,statuscode,digest,length'),
                      ('filter','statuscode:200'),('limit','20000')]
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 archive recovery'})
                  with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
                  Path(f'cdx-prefix/prefix-{i}.json').write_text(json.dumps(data,indent=2))
                  if data and isinstance(data[0],list): rows.extend(data[1:])
                  report.append(f'PREFIX {prefix}: {max(0,len(data)-1)} rows')
              except Exception as e:
                  report.append(f'PREFIX ERROR {prefix}: {type(e).__name__}: {e}')

          def score(stem,row):
              ts,orig,mime,status,digest,length=row
              lo=orig.lower(); name=lo.rsplit('/',1)[-1].split('?',1)[0]
              try: size=int(length)
              except: size=0
              # Strongly prefer exact asset/display files, then large responsive versions.
              exact = name in (stem+'.jpg',stem+'.png')
              asset = '/assets/' in lo
              return (2 if exact else 0, 1 if asset else 0, size, ts)

          def fetch(row,stem):
              ts,orig,mime,status,digest,length=row
              ext='.png' if ('png' in mime.lower() or orig.lower().split('?',1)[0].endswith('.png')) else '.jpg'
              out=Path('recovered-images')/(stem+ext)
              for mod in ('id_','im_'):
                  u=f'https://web.archive.org/web/{ts}{mod}/{orig}'
                  tmp=Path('/tmp/recovery-candidate')
                  cp=subprocess.run(['curl','-L','--fail','--silent','--show-error','--retry','3','--retry-all-errors','--connect-timeout','20','--max-time','120','-A','Mozilla/5.0 archive recovery',u,'-o',str(tmp)],capture_output=True,text=True)
                  if cp.returncode==0 and tmp.exists():
                      mt=subprocess.check_output(['file','--mime-type','-b',str(tmp)],text=True).strip()
                      n=tmp.stat().st_size
                      if mt.startswith('image/') and n>1500:
                          out.write_bytes(tmp.read_bytes())
                          return out,u,mt,n
              return None

          for stem in targets:
              matching=[r for r in rows if stem.lower() in r[1].lower() and r[3]=='200' and (r[2].startswith('image/') or any(x in r[1].lower() for x in ('.jpg','.jpeg','.png')))]
              # Deduplicate same capture/original/digest.
              unique=[]; seen=set()
              for r in matching:
                  k=(r[0],r[1],r[4])
                  if k not in seen: seen.add(k); unique.append(r)
              unique.sort(key=lambda r: score(stem,r),reverse=True)
              report.append(f'CANDIDATES {stem}: {len(unique)}')
              found=None
              for r in unique[:40]:
                  found=fetch(r,stem)
                  if found:
                      out,u,mt,n=found
                      report.append(f'RECOVERED {stem}: {out} | {n} bytes | {mt} | {u}')
                      break
              if not found: report.append(f'MISSING {stem}')

          Path('cdx-fast-report.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY

      - name: Commit recovered material
        shell: bash
        run: |
          git config user.name 'archive-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-images cdx-prefix cdx-fast-report.txt
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Fast CDX recovery of Baddesley Clinton images'
            git push origin HEAD:${{ github.head_ref }}
          fi
