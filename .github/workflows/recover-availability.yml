name: Exact URL Wayback availability recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  availability-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover exact Muse image URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p availability-images
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, subprocess, time, re
          from pathlib import Path

          candidates = {
            'baddesley_clinton_plan': [
              'assets/baddesley_clinton_plan.png',
              'images/baddesley_clinton_plan.jpg?crc=4079519696',
              'images/baddesley_clinton_plan200x191.jpg?crc=3881529525',
              'images/baddesley_clinton_plan201x192.jpg?crc=3881529525',
              'images/baddesley_clinton_plan266x254.jpg?crc=9451670'],
            'baddesley_castle5': [
              'assets/baddesley_castle5.jpg','images/baddesley_castle5.jpg?crc=3975735450',
              'images/baddesley_castle501x239.jpg?crc=3844662414','images/baddesley_castle502x239.jpg?crc=3844662414',
              'images/baddesley_castle5241x161.jpg?crc=336125542','images/baddesley_castle5242x161.jpg?crc=350163407',
              'images/baddesley_castle5320x214.jpg?crc=3861364141','images/baddesley_castle5321x214.jpg?crc=3861364141',
              'images/baddesley_castle560x40.jpg?crc=418560190'],
            'baddesley_castle9': [
              'assets/baddesley_castle9.jpg','images/baddesley_castle9.jpg?crc=3843622111',
              'images/baddesley_castle9128x162.jpg?crc=524506829','images/baddesley_castle9170x215.jpg?crc=82528509',
              'images/baddesley_castle936x45.jpg?crc=505838259','images/baddesley_castle9a.jpg?crc=4214904937'],
            'baddesley_castle24': [
              'assets/baddesley_castle24.jpg','images/baddesley_castle24.jpg?crc=327368683',
              'images/baddesley_castle24244x163.jpg?crc=168792684','images/baddesley_castle24324x216.jpg?crc=252502805',
              'images/baddesley_castle2463x309.jpg?crc=138612683'],
            'baddesley_castle23': [
              'assets/baddesley_castle23.jpg','images/baddesley_castle23.jpg?crc=529354828',
              'images/baddesley_castle23244x163.jpg?crc=388478629','images/baddesley_castle23245x163.jpg?crc=3943640466',
              'images/baddesley_castle23324x216.jpg?crc=4075909043','images/baddesley_castle23325x217.jpg?crc=4075909043',
              'images/baddesley_castle2360x40.jpg?crc=4132076869','images/baddesley_castle2398x265.jpg?crc=470358847',
              'images/baddesley_castle2398x266.jpg?crc=4013420218'],
            'baddesley_castle10': [
              'assets/baddesley_castle10.jpg','images/baddesley_castle10.jpg?crc=4077471748',
              'images/baddesley_castle10256x171.jpg?crc=3823730221','images/baddesley_castle10257x171.jpg?crc=3823730221',
              'images/baddesley_castle10340x227.jpg?crc=320332269','images/baddesley_castle10341x227.jpg?crc=320332269',
              'images/baddesley_castle1060x40.jpg?crc=4199063599'],
            'baddesley_castle12': [
              'assets/baddesley_castle12.jpg','images/baddesley_castle12.jpg?crc=3868328721',
              'images/baddesley_castle12256x171.jpg?crc=495917510','images/baddesley_castle12257x171.jpg?crc=495917510',
              'images/baddesley_castle12340x227.jpg?crc=346029863','images/baddesley_castle12341x227.jpg?crc=346029863',
              'images/baddesley_castle1260x40.jpg?crc=4188653019'],
            'baddesley_castle14_priest_hole': [
              'assets/baddesley_castle14_priest_hole.jpg','images/baddesley_castle14_priest_hole.jpg?crc=42613693',
              'images/baddesley_castle14_priest_hole222x333.jpg?crc=341728819',
              'images/baddesley_castle14_priest_hole232x348.jpg?crc=4048550400',
              'images/baddesley_castle14_priest_hole233x349.jpg?crc=4048550400',
              'images/baddesley_castle14_priest_hole308x462.jpg?crc=4059488850',
              'images/baddesley_castle14_priest_hole309x463.jpg?crc=4059488850',
              'images/baddesley_castle14_priest_hole30x46.jpg?crc=85876542']
          }

          bases=[
            'http://www.castlesfortsbattles.co.uk/midlands/',
            'https://www.castlesfortsbattles.co.uk/midlands/',
            'http://castlesfortsbattles.co.uk/midlands/',
            'https://castlesfortsbattles.co.uk/midlands/'
          ]
          timestamps=['20210618112926','20200301000000','20220826211917']
          report=[]; raw={}

          def available(original, wanted_ts):
              q=urllib.parse.urlencode({'url':original,'timestamp':wanted_ts})
              api='https://archive.org/wayback/available?'+q
              try:
                  req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0 archive recovery'})
                  with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
                  raw[original+' @ '+wanted_ts]=data
                  snap=data.get('archived_snapshots',{}).get('closest')
                  if snap and snap.get('available') and snap.get('url'):
                      return snap
              except Exception as e:
                  report.append(f'API ERROR {original} @ {wanted_ts}: {type(e).__name__}: {e}')
              return None

          def download(snapshot, stem):
              u=snapshot['url'].replace('http://web.archive.org/','https://web.archive.org/')
              # Prefer raw replay mode to avoid Wayback HTML chrome.
              m=re.search(r'/web/(\d{14})/(.+)$',u)
              urls=[]
              if m:
                  ts,orig=m.group(1),m.group(2)
                  urls=[f'https://web.archive.org/web/{ts}id_/{orig}',f'https://web.archive.org/web/{ts}im_/{orig}',u]
              else: urls=[u]
              for ru in urls:
                  tmp=Path('/tmp/availability-candidate')
                  cp=subprocess.run(['curl','-L','--fail','--silent','--show-error','--retry','2','--retry-all-errors','--connect-timeout','20','--max-time','90','-A','Mozilla/5.0 archive recovery',ru,'-o',str(tmp)],capture_output=True,text=True)
                  if cp.returncode==0 and tmp.exists():
                      mt=subprocess.check_output(['file','--mime-type','-b',str(tmp)],text=True).strip()
                      n=tmp.stat().st_size
                      if mt.startswith('image/') and n>1500:
                          ext='.png' if 'png' in mt else '.jpg'
                          out=Path('availability-images')/(stem+ext)
                          out.write_bytes(tmp.read_bytes())
                          return out,ru,mt,n
              return None

          for stem, rels in candidates.items():
              found=None; checks=0
              for rel in rels:
                  if found: break
                  for base in bases:
                      if found: break
                      original=base+rel
                      for ts in timestamps:
                          checks+=1
                          snap=available(original,ts)
                          if snap:
                              got=download(snap,stem)
                              if got:
                                  out,ru,mt,n=got
                                  report.append(f'RECOVERED {stem}: {out} | {n} bytes | {mt} | requested {original} | snapshot {snap.get("timestamp")} | {ru}')
                                  found=got
                                  break
                          time.sleep(0.08)
              if not found: report.append(f'MISSING {stem}: availability checks={checks}')

          Path('availability-report.txt').write_text('\n'.join(report)+'\n')
          Path('availability-raw.json').write_text(json.dumps(raw,indent=2))
          print('\n'.join(report))
          PY

      - name: Commit availability recovery results
        shell: bash
        run: |
          git config user.name 'archive-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add availability-images availability-report.txt availability-raw.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Recover Baddesley images via exact Wayback availability URLs'
            git push origin HEAD:${{ github.head_ref }}
          fi
