name: Independent Baddesley recovery macOS

on:
  push:
    paths:
      - '.github/workflows/recover-independent-macos.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query Common Crawl with supported wildcard URL patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p commoncrawl-verified
          python3 - <<'PY'
          import concurrent.futures, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          stems=['baddesley_clinton_plan','baddesley_castle5','baddesley_castle9','baddesley_castle24','baddesley_castle23','baddesley_castle10','baddesley_castle12','baddesley_castle14_priest_hole']
          hdr={'User-Agent':'castles-forts-battles-archive-recovery/1.0'}

          def fetch(url, timeout=12):
              try:
                  req=urllib.request.Request(url,headers=hdr)
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return True,r.read().decode('utf-8','replace'),getattr(r,'status',200)
              except Exception as e:
                  return False,str(e),None

          ok,txt,status=fetch('https://index.commoncrawl.org/collinfo.json')
          if not ok:
              raise SystemExit('Could not load Common Crawl collection list: '+txt)
          crawls=[]
          for c in json.loads(txt):
              cid=c.get('id',''); m=re.match(r'CC-MAIN-(\d{4})-',cid)
              if m and 2017<=int(m.group(1))<=2022:
                  crawls.append(cid)

          # Common Crawl documents wildcard prefix searches as url=host/path/*.
          patterns=[
              'www.castlesfortsbattles.co.uk/midlands/assets/baddesley*',
              'www.castlesfortsbattles.co.uk/midlands/images/baddesley*',
              'castlesfortsbattles.co.uk/midlands/assets/baddesley*',
              'castlesfortsbattles.co.uk/midlands/images/baddesley*'
          ]
          specs=[]
          for cid in crawls:
              endpoint=f'https://index.commoncrawl.org/{cid}-index'
              for pattern in patterns:
                  q=endpoint+'?'+urllib.parse.urlencode({'url':pattern,'output':'json'})
                  specs.append((cid,pattern,q))

          def one(spec):
              cid,pattern,q=spec
              # One retry after a short pause for transient rate limits.
              ok,body,status=fetch(q,12)
              if not ok and ('429' in body or '503' in body):
                  time.sleep(0.8)
                  ok,body,status=fetch(q,12)
              rows=[]
              if ok:
                  for line in body.splitlines():
                      try:r=json.loads(line)
                      except:continue
                      u=r.get('url','').lower()
                      if 'baddesley' in u:
                          r['_crawl']=cid; rows.append(r)
              return {'crawl':cid,'pattern':pattern,'ok':ok,'status':status,'error':None if ok else body[:200],'rows':rows}

          logs=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              for item in ex.map(one,specs):
                  logs.append(item)

          rows=[]
          for item in logs: rows.extend(item['rows'])
          uniq=[]; seen=set()
          for r in rows:
              k=(r.get('url'),r.get('timestamp'),r.get('filename'),r.get('offset'),r.get('length'))
              if k not in seen: seen.add(k); uniq.append(r)

          summary={s:sum(1 for r in uniq if s in r.get('url','').lower()) for s in stems}
          ok_count=sum(1 for x in logs if x['ok']); fail_count=len(logs)-ok_count
          error_counts={}
          for x in logs:
              if not x['ok']:
                  e=x['error'] or 'unknown'; key=e.split(':',1)[0]
                  error_counts[key]=error_counts.get(key,0)+1

          compact_logs=[{k:v for k,v in x.items() if k!='rows'}|{'row_count':len(x['rows'])} for x in logs]
          result={'crawls':crawls,'patterns':patterns,'queries_ok':ok_count,'queries_failed':fail_count,'error_counts':error_counts,'summary':summary,'hits':uniq,'query_log':compact_logs}
          Path('commoncrawl-verified/results.json').write_text(json.dumps(result,indent=2))
          lines=[f'Common Crawl crawls={len(crawls)}; queries_ok={ok_count}; failed={fail_count}; unique_baddesley_rows={len(uniq)}']
          lines += [f'{s}: {n}' for s,n in summary.items()]
          Path('commoncrawl-verified/report.txt').write_text('\n'.join(lines)+'\n')
          print(Path('commoncrawl-verified/report.txt').read_text())
          PY
      - name: Commit verified Common Crawl results
        shell: bash
        run: |
          git config user.name 'archive-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add commoncrawl-verified
          git commit -m 'Verified Common Crawl wildcard search' || exit 0
          git pull --rebase origin main
          git push
