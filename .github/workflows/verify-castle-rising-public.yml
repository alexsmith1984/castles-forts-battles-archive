name: Verify Castle Rising public page

on:
  push:
    paths:
      - '.github/workflows/verify-castle-rising-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Verify deployed Castle Rising page and assets
        run: |
          python - <<'PY'
          import json,time,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          base='https://alexsmith1984.github.io/castles-forts-battles-archive/'
          page=base+'recovered/castle-rising-castle/'
          report=json.loads(Path('recovered/castle-rising-castle/recovery-report.json').read_text(encoding='utf-8'))
          recovered=report['recovered_full_or_near_full']+report['recovered_thumbnail_or_lower_resolution']
          expected=f"{recovered} of {report['original_image_positions_identified']} identified content images"
          html=None
          for n in range(18):
              r=requests.get(page,timeout=20,headers={'Cache-Control':'no-cache'})
              if r.status_code==200 and expected in r.text and 'castle_rising82.jpg' in r.text:
                  html=r.text
                  break
              time.sleep(10)
          assert html is not None, 'Updated public Castle Rising page did not become visible in retry window'
          soup=BeautifulSoup(html,'html.parser')
          public_imgs=[x.get('src') for x in soup.find_all('img',src=True)]
          assert len(public_imgs)==recovered,(len(public_imgs),recovered)
          bad=[]
          for rel in public_imgs:
              u=base+'recovered/castle-rising-castle/'+rel
              rr=requests.get(u,timeout=20)
              if rr.status_code!=200 or len(rr.content)<500:bad.append((u,rr.status_code,len(rr.content)))
          assert not bad,bad
          az=requests.get(base+'atoz-part1.html',timeout=20).text
          assert 'recovered/castle-rising-castle/' in az
          print(json.dumps({'public_url':page,'http_status':200,'expected_marker':expected,'public_images_verified':len(public_imgs),'atoz_link_verified':True},indent=2))
          PY
