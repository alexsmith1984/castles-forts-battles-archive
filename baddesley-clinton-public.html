<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baddesley Clinton | Castles, Forts and Battles — Archive</title>
<style>
html,body{margin:0;padding:0;background:#fff}
#page{display:block;width:100%;border:0;min-height:100vh}
</style>
</head>
<body>
<iframe id="page" src="baddesley-clinton.html" title="Baddesley Clinton archived reconstruction"></iframe>
<script>
const frame=document.getElementById('page');
function clean(){
  try{
    const d=frame.contentDocument;
    if(!d)return;
    d.querySelectorAll('img').forEach(img=>{
      img.onerror=()=>{const f=img.closest('figure');if(f)f.remove();else img.remove();resize();};
      if(img.complete && (!img.naturalWidth || !img.naturalHeight)){
        const f=img.closest('figure');if(f)f.remove();else img.remove();
      }
    });
    resize();
  }catch(e){}
}
function resize(){
  try{
    const d=frame.contentDocument;
    if(d&&d.documentElement) frame.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';
  }catch(e){}
}
frame.addEventListener('load',()=>{
  clean();
  setTimeout(clean,2500);
  setTimeout(clean,6000);
  setTimeout(clean,12000);
  setTimeout(clean,20000);
});
window.addEventListener('resize',resize);
</script>
</body>
</html>
